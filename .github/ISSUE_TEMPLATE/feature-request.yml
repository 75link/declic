name: Feature request
description: Something you'd want Declic to do.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation more than the solution. "After a wedding I need to..." is more useful than "add a button that...".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
